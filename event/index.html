<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント情報 | GDGoC KIT</title>

    <!--
  ============================================================
  イベント情報ページ（event/index.html）
  ============================================================
  使い方:
  1. 新しいイベントを追加したら、このHTMLは編集しない。
     代わりに assets/data/events.json に1件分のエントリを追加する。
     （title / start / end / venue / excerpt / href / reportHref）
  2. 終了しているかどうかは end（無ければstart）と現在時刻を
     JS側で比較し、「予定しているイベント」「終了したイベント」に
     自動で振り分けて描画する（HTML/CSS側は変更不要）
  3. 終了したイベントは reportHref があればイベントレポートへのリンクに、
     無ければ「レポート作成中」バッジが表示される

  スタイルは共通CSS（assets/css/）を読み込んでいる。
  デザインを変えたいときは assets/css/base.css（全ページ共通）
  または assets/css/event-list.css（このページ専用）を編集する。
  ============================================================
-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/event-list.css">
</head>

<body>
    <div class="wrap">

        <div class="chapter-bar">
            <img class="logo" src="../assets/images/branding/logo.png" alt="GDGoC KIT">
            <a class="back" href="../index.html">← トップページ</a>
        </div>

        <header class="page-head">
            <p class="eyebrow">EVENTS</p>
            <h1>イベント情報</h1>
            <p>GDGoC KIT が開催・共催するイベントの情報です。終了したイベントは、公開され次第イベントレポートからも振り返れます。</p>
        </header>

        <!-- assets/data/events.json の内容をJSで読み込んで、ここに<li>を生成する -->
        <section class="event-section">
            <h2>予定しているイベント</h2>
            <ul class="event-list" id="upcoming-list"></ul>
            <p id="upcoming-empty" class="event-list-empty" hidden>
                現在予定しているイベントはありません。
            </p>
        </section>

        <section class="event-section is-ended">
            <h2>終了したイベント</h2>
            <ul class="event-list" id="ended-list"></ul>
            <p id="ended-empty" class="event-list-empty" hidden>
                終了したイベントはまだありません。
            </p>
        </section>

    </div>

    <script src="../assets/js/event-list.js"></script>
</body>

</html>
